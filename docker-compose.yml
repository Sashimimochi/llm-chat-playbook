services:
  # ---- ローカルLLMサーバ ----
  ollama:
    image: ollama/ollama:latest
    pull_policy: always
    container_name: ohbook-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Aider / Coding Agent用途を想定。
      # 大きな値ほどメモリ使用量が増えるので、
      # MacBook Airではまず16k～32k程度から検証する。
      - OLLAMA_CONTEXT_LENGTH=32768

      # Composeネットワークからもlistenする。
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---- AI coding agent ----
  aider:
    build:
      context: .
      dockerfile: Dockerfile.aider
    container_name: ohbook-aider

    # `docker compose run aider ...` で対話的に使うため
    stdin_open: true
    tty: true

    # Aiderコンテナ内の /app をプロジェクトルートにする
    working_dir: /app

    # ホスト側のGitリポジトリをそのままAiderから見せる
    volumes:
      - ./:/app

    # Mac側のUID/GIDでファイルを作成する
    user: "${UID:-1000}:${GID:-1000}"

    environment:
      # Compose上では localhost ではなく
      # サービス名 `ollama` で接続する
      OLLAMA_API_BASE: http://ollama:11434
      AIDER_TIMEOUT: "1800"
      GH_TOKEN: "${GH_TOKEN}"

    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:
